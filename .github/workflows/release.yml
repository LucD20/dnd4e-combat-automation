name: Release

# Publish a GitHub release (tag e.g. v0.1.0) and this builds module.zip + module.json for it.
# Install URL for Foundry/Molten:
#   https://github.com/<owner>/<repo>/releases/latest/download/module.json

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version and URLs in module.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="https://github.com/${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" \
             --arg url "$REPO" \
             --arg manifest "$REPO/releases/latest/download/module.json" \
             --arg download "$REPO/releases/download/${GITHUB_REF_NAME}/module.zip" \
             '.version=$v | .url=$url | .manifest=$manifest | .download=$download' \
             module.json > module.tmp && mv module.tmp module.json

      - name: Build zip
        run: zip -r module.zip module.json scripts lang styles icons README.md LICENSE

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" module.json module.zip --clobber
